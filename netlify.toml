[build]
  command       = "pnpm --filter @workspace/portfolio run build"
  publish       = "artifacts/portfolio/dist/public"
  functions     = "netlify/functions"

[build.environment]
  BASE_PATH = "/"
  NODE_VERSION = "20"

# Redirect /api/contact → serverless function (transparent to the frontend)
[[redirects]]
  from   = "/api/contact"
  to     = "/.netlify/functions/contact"
  status = 200

# SPA fallback — all routes served by index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
